<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 460" width="1180" height="460" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79C0FF"/>
      <stop offset="1" stop-color="#D2A8FF"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx=".85" cy=".1" r=".55">
      <stop offset="0" stop-color="#8250DF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#8250DF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx=".1" cy=".95" r=".5">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity=".10"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card">
      <rect x="8" y="8" width="1164" height="444" rx="16"/>
    </clipPath>
  </defs>

  <!-- Card -->
  <g clip-path="url(#card)">
    <rect x="8" y="8" width="1164" height="444" fill="#0D1117"/>
    <rect x="8" y="8" width="1164" height="444" fill="url(#glowPurple)"/>
    <rect x="8" y="8" width="1164" height="444" fill="url(#glowBlue)"/>
    <rect x="8" y="8" width="1164" height="44" fill="#161B22"/>
  </g>
  <line x1="8" y1="52" x2="1172" y2="52" stroke="#21262D"/>
  <rect x="8" y="8" width="1164" height="444" rx="16" fill="none" stroke="#30363D"/>

  <!-- Header -->
  <circle cx="34" cy="30" r="5.5" fill="#FF5F56"/>
  <circle cx="54" cy="30" r="5.5" fill="#FFBD2E"/>
  <circle cx="74" cy="30" r="5.5" fill="#27C93F"/>
  <text x="96" y="34" font-size="12.5" fill="#8B949E">daus@bali — ~/readme</text>
  <text x="1146" y="34" font-size="12.5" fill="#8B949E" text-anchor="end">main</text>

  <!-- Left column -->
  <g transform="translate(40,104)">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".4s" begin=".15s" fill="freeze"/>
      <text y="0" font-size="14"><tspan fill="#7EE787">$</tspan><tspan fill="#E6EDF3"> whoami</tspan></text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".5s" begin=".35s" fill="freeze"/>
      <text y="44" font-size="31" font-weight="700" fill="url(#nameGrad)">Abdurrahman Firdaus</text>
      <rect x="2" y="58" width="150" height="3" rx="1.5" fill="url(#nameGrad)"/>
    </g>

    <!-- Cycling role -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".4s" begin=".6s" fill="freeze"/>
      <text y="94" font-size="15.5" fill="#8B949E">&gt;</text>
      <text x="20" y="94" font-size="15.5" font-weight="600" fill="#D2A8FF" opacity="1">
        <tspan>Forward Deployed Engineer</tspan><tspan fill="#79C0FF"> ▊<animate attributeName="opacity" values="1;0;1" dur="1.1s" begin="1s" repeatCount="indefinite"/></tspan>
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.29;0.33;0.96;1" dur="12s" begin="3s" repeatCount="indefinite"/>
      </text>
      <text x="20" y="94" font-size="15.5" font-weight="600" fill="#D2A8FF" opacity="0">
        <tspan>Software Engineer</tspan><tspan fill="#79C0FF"> ▊<animate attributeName="opacity" values="1;0;1" dur="1.1s" begin="1s" repeatCount="indefinite"/></tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.29;0.33;0.62;0.66;1" dur="12s" begin="3s" repeatCount="indefinite"/>
      </text>
      <text x="20" y="94" font-size="15.5" font-weight="600" fill="#D2A8FF" opacity="0">
        <tspan>AI Architect</tspan><tspan fill="#79C0FF"> ▊<animate attributeName="opacity" values="1;0;1" dur="1.1s" begin="1s" repeatCount="indefinite"/></tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.66;0.96;1" dur="12s" begin="3s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- Info rows -->
    <g font-size="13">
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".4s" begin=".8s" fill="freeze"/>
        <text y="136" fill="#8B949E">location</text>
        <text x="110" y="136" fill="#E6EDF3">Bali, Indonesia · UTC+8</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".4s" begin=".95s" fill="freeze"/>
        <text y="163" fill="#8B949E">now</text>
        <text x="110" y="163" fill="#E6EDF3">Tech Lead — PT Unicorn Food &amp; Service</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".4s" begin="1.1s" fill="freeze"/>
        <text y="190" fill="#8B949E">education</text>
        <text x="110" y="190" fill="#E6EDF3">Software Engineering · Telkom University</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".4s" begin="1.25s" fill="freeze"/>
        <text y="217" fill="#8B949E">portfolio</text>
        <text x="110" y="217" fill="#79C0FF">abdurrahmanfirdaus.com</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".4s" begin="1.4s" fill="freeze"/>
        <text y="244" fill="#8B949E">email</text>
        <text x="110" y="244" fill="#E6EDF3">hello@abdurrahmanfirdaus.com</text>
      </g>
    </g>

    <!-- Idle prompt -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".4s" begin="1.85s" fill="freeze"/>
      <text y="286" font-size="14" fill="#7EE787">$</text>
      <rect x="18" y="273" width="9" height="16" fill="#E6EDF3">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" begin="2s" repeatCount="indefinite"/>
      </rect>
    </g>
