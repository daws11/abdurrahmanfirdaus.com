        <g transform="translate(104,0)"><rect width="56" height="26" rx="6" fill="#161B22" stroke="#30363D"/><text x="28" y="17.5" fill="#79C0FF">React</text></g>
        <g transform="translate(168,0)"><rect width="71" height="26" rx="6" fill="#161B22" stroke="#30363D"/><text x="35.5" y="17.5" fill="#79C0FF">Next.js</text></g>
        <g transform="translate(247,0)"><rect width="92" height="26" rx="6" fill="#161B22" stroke="#30363D"/><text x="46" y="17.5" fill="#79C0FF">TypeScript</text></g>
        <g transform="translate(347,0)"><rect width="71" height="26" rx="6" fill="#161B22" stroke="#30363D"/><text x="35.5" y="17.5" fill="#79C0FF">Node.js</text></g>
      </g>
    </g>

    <g opacity="0" transform="translate(0,56)">
      <animate attributeName="opacity" values="0;1" dur=".4s" begin="1.2s" fill="freeze"/>
      <text y="17" font-size="11" fill="#8B949E">ai agents</text>
      <g font-size="12" text-anchor="middle">
        <g transform="translate(104,0)"><rect width="85" height="26" rx="6" fill="#161B22" stroke="#30363D"/><text x="42.5" y="17.5" fill="#D2A8FF">Mastra AI</text></g>
        <g transform="translate(197,0)"><rect width="41" height="26" rx="6" fill="#161B22" stroke="#30363D"/><text x="20.5" y="17.5" fill="#D2A8FF">n8n</text></g>
        <g transform="translate(246,0)"><rect width="41" height="26" rx="6" fill="#161B22" stroke="#30363D"/><text x="20.5" y="17.5" fill="#D2A8FF">RAG</text></g>
        <g transform="translate(295,0)"><rect width="99" height="26" rx="6" fill="#161B22" stroke="#30363D"/><text x="49.5" y="17.5" fill="#D2A8FF">Claude Code</text></g>
      </g>
    </g>

    <g opacity="0" transform="translate(0,94)">
      <animate attributeName="opacity" values="0;1" dur=".4s" begin="1.35s" fill="freeze"/>
      <text y="17" font-size="11" fill="#8B949E">integrations</text>
      <g font-size="12" text-anchor="middle">
        <g transform="translate(104,0)"><rect width="49" height="26" rx="6" fill="#161B22" stroke="#30363D"/><text x="24.5" y="17.5" fill="#7EE787">Xero</text></g>
        <g transform="translate(161,0)"><rect width="71" height="26" rx="6" fill="#161B22" stroke="#30363D"/><text x="35.5" y="17.5" fill="#7EE787">iSeller</text></g>
        <g transform="translate(240,0)"><rect width="78" height="26" rx="6" fill="#161B22" stroke="#30363D"/><text x="39" y="17.5" fill="#7EE787">WhatsApp</text></g>
        <g transform="translate(326,0)"><rect width="85" height="26" rx="6" fill="#161B22" stroke="#30363D"/><text x="42.5" y="17.5" fill="#7EE787">Instagram</text></g>
      </g>
    </g>

    <g opacity="0" transform="translate(0,132)">
      <animate attributeName="opacity" values="0;1" dur=".4s" begin="1.5s" fill="freeze"/>
      <text y="17" font-size="11" fill="#8B949E">infra</text>
      <g font-size="12" text-anchor="middle">
        <g transform="translate(104,0)"><rect width="92" height="26" rx="6" fill="#161B22" stroke="#30363D"/><text x="46" y="17.5" fill="#FFA657">PostgreSQL</text></g>
        <g transform="translate(204,0)"><rect width="64" height="26" rx="6" fill="#161B22" stroke="#30363D"/><text x="32" y="17.5" fill="#FFA657">Docker</text></g>
        <g transform="translate(276,0)"><rect width="64" height="26" rx="6" fill="#161B22" stroke="#30363D"/><text x="32" y="17.5" fill="#FFA657">Python</text></g>
        <g transform="translate(348,0)"><rect width="56" height="26" rx="6" fill="#161B22" stroke="#30363D"/><text x="28" y="17.5" fill="#FFA657">CI/CD</text></g>
      </g>
    </g>

    <!-- How I work -->
    <g opacity="0" font-size="12" fill="#8B949E">
      <animate attributeName="opacity" values="0;1" dur=".4s" begin="1.7s" fill="freeze"/>
      <text y="200"># Discover → Design → Deploy → Drive adoption.</text>
      <text y="222"># Repeat until it sticks.</text>
    </g>
  </g>

  <!-- Status bar -->
  <line x1="40" y1="400" x2="1140" y2="400" stroke="#21262D"/>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".4s" begin="2s" fill="freeze"/>
    <circle cx="46" cy="422" r="3.5" fill="#3FB950">
      <animate attributeName="opacity" values="1;.35;1" dur="3s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="58" y="426" font-size="12" fill="#8B949E">open to full-time roles · fractional CTO · serious collaborations</text>
    <text x="1140" y="426" font-size="12" fill="#79C0FF" text-anchor="end">abdurrahmanfirdaus.com</text>
  </g>
</svg>
