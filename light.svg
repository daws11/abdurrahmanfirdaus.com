<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 460" width="1180" height="460" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969DA"/>
      <stop offset="1" stop-color="#8250DF"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx=".85" cy=".1" r=".55">
      <stop offset="0" stop-color="#8250DF" stop-opacity=".05"/>
      <stop offset="1" stop-color="#8250DF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx=".1" cy=".95" r=".5">
      <stop offset="0" stop-color="#0969DA" stop-opacity=".04"/>
      <stop offset="1" stop-color="#0969DA" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card">
      <rect x="8" y="8" width="1164" height="444" rx="16"/>
    </clipPath>
  </defs>

  <!-- Card -->
  <g clip-path="url(#card)">
    <rect x="8" y="8" width="1164" height="444" fill="#FFFFFF"/>
    <rect x="8" y="8" width="1164" height="444" fill="url(#glowPurple)"/>
    <rect x="8" y="8" width="1164" height="444" fill="url(#glowBlue)"/>
    <rect x="8" y="8" width="1164" height="44" fill="#F6F8FA"/>
  </g>
  <line x1="8" y1="52" x2="1172" y2="52" stroke="#D8DEE4"/>
  <rect x="8" y="8" width="1164" height="444" rx="16" fill="none" stroke="#D1D9E0"/>

  <!-- Header -->
  <circle cx="34" cy="30" r="5.5" fill="#FF5F56"/>
  <circle cx="54" cy="30" r="5.5" fill="#FFBD2E"/>
  <circle cx="74" cy="30" r="5.5" fill="#27C93F"/>
  <text x="96" y="34" font-size="12.5" fill="#59636E">daus@bali — ~/readme</text>
  <text x="1146" y="34" font-size="12.5" fill="#59636E" text-anchor="end">main</text>

  <!-- Left column -->
  <g transform="translate(40,104)">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".4s" begin=".15s" fill="freeze"/>
      <text y="0" font-size="14"><tspan fill="#1A7F37">$</tspan><tspan fill="#1F2328"> whoami</tspan></text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".5s" begin=".35s" fill="freeze"/>
      <text y="44" font-size="31" font-weight="700" fill="url(#nameGrad)">Abdurrahman Firdaus</text>
      <rect x="2" y="58" width="150" height="3" rx="1.5" fill="url(#nameGrad)"/>
    </g>

    <!-- Cycling role -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".4s" begin=".6s" fill="freeze"/>
      <text y="94" font-size="15.5" fill="#59636E">&gt;</text>
      <text x="20" y="94" font-size="15.5" font-weight="600" fill="#8250DF" opacity="1">
        <tspan>Forward Deployed Engineer</tspan><tspan fill="#0969DA"> ▊<animate attributeName="opacity" values="1;0;1" dur="1.1s" begin="1s" repeatCount="indefinite"/></tspan>
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.29;0.33;0.96;1" dur="12s" begin="3s" repeatCount="indefinite"/>
      </text>
      <text x="20" y="94" font-size="15.5" font-weight="600" fill="#8250DF" opacity="0">
        <tspan>Software Engineer</tspan><tspan fill="#0969DA"> ▊<animate attributeName="opacity" values="1;0;1" dur="1.1s" begin="1s" repeatCount="indefinite"/></tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.29;0.33;0.62;0.66;1" dur="12s" begin="3s" repeatCount="indefinite"/>
      </text>
      <text x="20" y="94" font-size="15.5" font-weight="600" fill="#8250DF" opacity="0">
        <tspan>AI Architect</tspan><tspan fill="#0969DA"> ▊<animate attributeName="opacity" values="1;0;1" dur="1.1s" begin="1s" repeatCount="indefinite"/></tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.66;0.96;1" dur="12s" begin="3s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- Info rows -->
    <g font-size="13">
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".4s" begin=".8s" fill="freeze"/>
        <text y="136" fill="#59636E">location</text>
        <text x="110" y="136" fill="#1F2328">Bali, Indonesia · UTC+8</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".4s" begin=".95s" fill="freeze"/>
        <text y="163" fill="#59636E">now</text>
        <text x="110" y="163" fill="#1F2328">Tech Lead — PT Unicorn Food &amp; Service</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".4s" begin="1.1s" fill="freeze"/>
        <text y="190" fill="#59636E">education</text>
        <text x="110" y="190" fill="#1F2328">Software Engineering · Telkom University</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".4s" begin="1.25s" fill="freeze"/>
        <text y="217" fill="#59636E">portfolio</text>
        <text x="110" y="217" fill="#0969DA">abdurrahmanfirdaus.com</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur=".4s" begin="1.4s" fill="freeze"/>
        <text y="244" fill="#59636E">email</text>
        <text x="110" y="244" fill="#1F2328">hello@abdurrahmanfirdaus.com</text>
      </g>
    </g>

    <!-- Idle prompt -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".4s" begin="1.85s" fill="freeze"/>
      <text y="286" font-size="14" fill="#1A7F37">$</text>
      <rect x="18" y="273" width="9" height="16" fill="#1F2328">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" begin="2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Right column: stack -->
  <g transform="translate(656,104)">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur=".4s" begin=".9s" fill="freeze"/>
      <text y="0" font-size="11" letter-spacing="2" fill="#59636E">STACK</text>
    </g>

    <g opacity="0" transform="translate(0,18)">
      <animate attributeName="opacity" values="0;1" dur=".4s" begin="1.05s" fill="freeze"/>
      <text y="17" font-size="11" fill="#59636E">full-stack</text>
      <g font-size="12" text-anchor="middle">
        <g transform="translate(104,0)"><rect width="56" height="26" rx="6" fill="#F6F8FA" stroke="#D1D9E0"/><text x="28" y="17.5" fill="#0969DA">React</text></g>
        <g transform="translate(168,0)"><rect width="71" height="26" rx="6" fill="#F6F8FA" stroke="#D1D9E0"/><text x="35.5" y="17.5" fill="#0969DA">Next.js</text></g>
        <g transform="translate(247,0)"><rect width="92" height="26" rx="6" fill="#F6F8FA" stroke="#D1D9E0"/><text x="46" y="17.5" fill="#0969DA">TypeScript</text></g>
        <g transform="translate(347,0)"><rect width="71" height="26" rx="6" fill="#F6F8FA" stroke="#D1D9E0"/><text x="35.5" y="17.5" fill="#0969DA">Node.js</text></g>
      </g>
    </g>

    <g opacity="0" transform="translate(0,56)">
      <animate attributeName="opacity" values="0;1" dur=".4s" begin="1.2s" fill="freeze"/>
      <text y="17" font-size="11" fill="#59636E">ai agents</text>
      <g font-size="12" text-anchor="middle">
        <g transform="translate(104,0)"><rect width="85" height="26" rx="6" fill="#F6F8FA" stroke="#D1D9E0"/><text x="42.5" y="17.5" fill="#8250DF">Mastra AI</text></g>
        <g transform="translate(197,0)"><rect width="41" height="26" rx="6" fill="#F6F8FA" stroke="#D1D9E0"/><text x="20.5" y="17.5" fill="#8250DF">n8n</text></g>
        <g transform="translate(246,0)"><rect width="41" height="26" rx="6" fill="#F6F8FA" stroke="#D1D9E0"/><text x="20.5" y="17.5" fill="#8250DF">RAG</text></g>
        <g transform="translate(295,0)"><rect width="99" height="26" rx="6" fill="#F6F8FA" stroke="#D1D9E0"/><text x="49.5" y="17.5" fill="#8250DF">Claude Code</text></g>
      </g>
    </g>

    <g opacity="0" transform="translate(0,94)">
      <animate attributeName="opacity" values="0;1" dur=".4s" begin="1.35s" fill="freeze"/>
      <text y="17" font-size="11" fill="#59636E">integrations</text>
      <g font-size="12" text-anchor="middle">
        <g transform="translate(104,0)"><rect width="49" height="26" rx="6" fill="#F6F8FA" stroke="#D1D9E0"/><text x="24.5" y="17.5" fill="#1A7F37">Xero</text></g>
        <g transform="translate(161,0)"><rect width="71" height="26" rx="6" fill="#F6F8FA" stroke="#D1D9E0"/><text x="35.5" y="17.5" fill="#1A7F37">iSeller</text></g>
        <g transform="translate(240,0)"><rect width="78" height="26" rx="6" fill="#F6F8FA" stroke="#D1D9E0"/><text x="39" y="17.5" fill="#1A7F37">WhatsApp</text></g>
        <g transform="translate(326,0)"><rect width="85" height="26" rx="6" fill="#F6F8FA" stroke="#D1D9E0"/><text x="42.5" y="17.5" fill="#1A7F37">Instagram</text></g>
      </g>
    </g>

    <g opacity="0" transform="translate(0,132)">
      <animate attributeName="opacity" values="0;1" dur=".4s" begin="1.5s" fill="freeze"/>
      <text y="17" font-size="11" fill="#59636E">infra</text>
      <g font-size="12" text-anchor="middle">
        <g transform="translate(104,0)"><rect width="92" height="26" rx="6" fill="#F6F8FA" stroke="#D1D9E0"/><text x="46" y="17.5" fill="#BC4C00">PostgreSQL</text></g>
        <g transform="translate(204,0)"><rect width="64" height="26" rx="6" fill="#F6F8FA" stroke="#D1D9E0"/><text x="32" y="17.5" fill="#BC4C00">Docker</text></g>
        <g transform="translate(276,0)"><rect width="64" height="26" rx="6" fill="#F6F8FA" stroke="#D1D9E0"/><text x="32" y="17.5" fill="#BC4C00">Python</text></g>
        <g transform="translate(348,0)"><rect width="56" height="26" rx="6" fill="#F6F8FA" stroke="#D1D9E0"/><text x="28" y="17.5" fill="#BC4C00">CI/CD</text></g>
      </g>
    </g>

    <!-- How I work -->
    <g opacity="0" font-size="12" fill="#59636E">
      <animate attributeName="opacity" values="0;1" dur=".4s" begin="1.7s" fill="freeze"/>
      <text y="200"># Discover → Design → Deploy → Drive adoption.</text>
      <text y="222"># Repeat until it sticks.</text>
    </g>
  </g>

  <!-- Status bar -->
  <line x1="40" y1="400" x2="1140" y2="400" stroke="#D8DEE4"/>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".4s" begin="2s" fill="freeze"/>
    <circle cx="46" cy="422" r="3.5" fill="#1A7F37">
      <animate attributeName="opacity" values="1;.35;1" dur="3s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="58" y="426" font-size="12" fill="#59636E">open to full-time roles · fractional CTO · serious collaborations</text>
    <text x="1140" y="426" font-size="12" fill="#0969DA" text-anchor="end">abdurrahmanfirdaus.com</text>
  </g>
</svg>
