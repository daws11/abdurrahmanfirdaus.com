        <text x="0" y="10" letter-spacing="1">SKU</text>
        <text x="60" y="10" text-anchor="end" letter-spacing="1">QTY</text>
        <text x="120" y="10" text-anchor="end" letter-spacing="1">PRICE</text>
        <text x="216" y="10" text-anchor="end" letter-spacing="1">TOTAL</text>
        <text x="0" y="30" fill="#0f172a">SKU-001</text>
        <text x="60" y="30" text-anchor="end" fill="#0f172a">80</text>
        <text x="120" y="30" text-anchor="end" fill="#0f172a">14.50</text>
        <text x="216" y="30" text-anchor="end" fill="#0f172a">1160.00</text>
        <text x="0" y="46" fill="#0f172a">SKU-002</text>
        <text x="60" y="46" text-anchor="end" fill="#0f172a">50</text>
        <text x="120" y="46" text-anchor="end" fill="#0f172a">3.80</text>
        <text x="216" y="46" text-anchor="end" fill="#0f172a">190.00</text>
        <text x="0" y="62" fill="#0f172a">SKU-005</text>
        <text x="60" y="62" text-anchor="end" fill="#0f172a">60</text>
        <text x="120" y="62" text-anchor="end" fill="#0f172a">0.85</text>
        <text x="216" y="62" text-anchor="end" fill="#0f172a">51.00</text>
        <line x1="0" y1="74" x2="216" y2="74" stroke="#e2e8f0"/>
