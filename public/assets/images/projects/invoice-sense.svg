          <text x="24" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#0f172a">INV-2026-047</text>
          <text x="24" y="30" font-size="9" fill="#94a3b8">Blue Bottle</text>
          <text x="124" y="36" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#0f172a" font-weight="600">$792</text>
