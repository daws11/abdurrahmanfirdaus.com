          <text x="24" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#0f172a">INV-2026-043</text>
          <text x="24" y="30" font-size="9" fill="#94a3b8">Sunlit Pastries</text>
