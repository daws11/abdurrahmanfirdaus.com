          <text x="24" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#0f172a">INV-2026-046</text>
          <text x="24" y="30" font-size="9" fill="#ef4444">Eden Mills · qty</text>
          <text x="124" y="36" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#0f172a" font-weight="600">$422</text>
