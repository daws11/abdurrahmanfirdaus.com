        <rect width="30" height="18" rx="9" fill="#2563eb"/>
        <text x="15" y="13" text-anchor="middle" fill="#ffffff" font-weight="600">All</text>
        <rect x="34" y="0" width="42" height="18" rx="9" fill="none" stroke="#cbd5e1"/>
        <text x="55" y="13" text-anchor="middle" fill="#64748b">Match</text>
        <rect x="80" y="0" width="48" height="18" rx="9" fill="none" stroke="#ef4444"/>
        <text x="104" y="13" text-anchor="middle" fill="#ef4444">Mism.</text>
