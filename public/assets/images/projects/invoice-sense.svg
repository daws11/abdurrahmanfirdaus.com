<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="is-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- bg -->
  <rect width="600" height="800" fill="#fafafa"/>
  <rect x="0" y="0" width="600" height="4" fill="url(#is-line)"/>

  <!-- Top bar -->
  <g transform="translate(0, 0)">
    <rect x="0" y="4" width="600" height="56" fill="#ffffff"/>
    <line x1="0" y1="60" x2="600" y2="60" stroke="#e2e8f0"/>
    <!-- brand -->
    <g transform="translate(20, 16)">
      <rect width="28" height="28" rx="6" fill="#2563eb"/>
      <text x="14" y="20" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="-0.5">IS</text>
    </g>
    <text x="58" y="34" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Invoice Sense</text>
    <rect x="155" y="20" width="60" height="20" rx="4" fill="#2563eb" fill-opacity="0.1" stroke="#2563eb" stroke-opacity="0.4"/>
    <text x="185" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="600" fill="#2563eb">v1.0</text>

    <!-- tab nav -->
    <g font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b" transform="translate(280, 0)">
      <rect x="0" y="14" width="60" height="32" fill="#2563eb" fill-opacity="0.08" rx="4"/>
      <text x="30" y="34" text-anchor="middle" fill="#2563eb" font-weight="600">Inbox</text>
      <text x="98" y="34">Reconciliation</text>
      <text x="180" y="34">Suppliers</text>
      <text x="234" y="34">Analytics</text>
      <text x="288" y="34">Payment</text>
      <text x="338" y="34">Logs</text>
    </g>

    <!-- right buttons -->
    <g transform="translate(440, 0)">
      <rect x="0" y="16" width="138" height="32" rx="6" fill="#2563eb"/>
      <text x="69" y="36" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">+ Upload invoices</text>
    </g>
  </g>

  <!-- 4 stat tiles -->
  <g transform="translate(20, 80)">
    <g>
      <rect width="138" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="14" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#64748b" letter-spacing="1">INVOICES</text>
      <text x="14" y="44" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#2563eb" font-style="italic">80</text>
      <text x="14" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#94a3b8">this period</text>
    </g>
    <g transform="translate(146, 0)">
      <rect width="138" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="14" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#64748b" letter-spacing="1">VERIFIED</text>
      <text x="14" y="44" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#16a34a">62</text>
      <text x="14" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#94a3b8">77% auto</text>
