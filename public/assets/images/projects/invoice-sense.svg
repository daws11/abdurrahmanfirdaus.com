    <!-- Col 3: data panel (30%) -->
    <g transform="translate(402, 0)">
      <rect width="156" height="380" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <line x1="0" y1="32" x2="156" y2="32" stroke="#e2e8f0"/>
      <text x="14" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#64748b" letter-spacing="1">EXTRACTED DATA</text>
