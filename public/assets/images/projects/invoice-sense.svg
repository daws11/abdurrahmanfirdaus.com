      <text x="14" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#64748b" letter-spacing="1">NEEDS REVIEW</text>
      <text x="14" y="44" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ef4444">12</text>
      <text x="14" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#94a3b8">field mismatch</text>
    </g>
    <g transform="translate(438, 0)">
      <rect width="138" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="14" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#64748b" letter-spacing="1">PENDING</text>
