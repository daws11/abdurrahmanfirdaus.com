    <text x="0" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#64748b" letter-spacing="2">RECONCILE  ·  CROSS-CHECK  ·  CLOSE</text>
    <text x="0" y="36" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#0f172a" font-weight="600">From multi-day spreadsheet exercise to a single screen per day.</text>
  </g>

  <text x="20" y="780" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#94a3b8" letter-spacing="2">PT UNICORN · INTERNAL · 01/05</text>
</svg>
