        <text x="0" y="14" fill="#0f172a">INV-2026-048</text>
        <text x="0" y="34" fill="#94a3b8" letter-spacing="1">VENDOR</text>
        <text x="0" y="48" fill="#0f172a">Acme Coffee Roasters</text>
        <text x="0" y="68" fill="#94a3b8" letter-spacing="1">CURRENCY</text>
        <text x="0" y="82" fill="#0f172a">USD</text>
        <text x="0" y="102" fill="#94a3b8" letter-spacing="1">PAYMENT</text>
        <text x="0" y="116" fill="#0f172a">Transfer</text>
      </g>
      <line x1="14" y1="216" x2="142" y2="216" stroke="#e2e8f0"/>
      <text x="14" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#64748b" letter-spacing="1">RECEIVING LOG</text>
      <g transform="translate(14, 244)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#64748b">
        <text x="0" y="0">SKU-001 · WH</text>
        <text x="0" y="14">SKU-002 · WH</text>
        <text x="0" y="28">SKU-005 · O1</text>
        <text x="0" y="42">SKU-001 · WH</text>
        <text x="0" y="56">SKU-005 · O5</text>
