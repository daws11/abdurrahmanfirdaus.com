<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="cf-logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cf-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- bg -->
  <rect width="600" height="800" fill="#f8fafc"/>
  <rect x="0" y="0" width="600" height="4" fill="url(#cf-line)"/>

  <!-- 64px icon-only rail -->
  <g transform="translate(0, 0)">
    <rect width="64" height="800" fill="#ffffff"/>
    <line x1="64" y1="0" x2="64" y2="800" stroke="#e2e8f0"/>
    <!-- Logo tile (gradient emerald) -->
    <g transform="translate(16, 16)">
      <rect width="32" height="32" rx="6" fill="url(#cf-logo)"/>
      <text x="16" y="22" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="-0.5">CF</text>
    </g>
    <!-- Rail icons (lucide-style) -->
    <g transform="translate(0, 70)" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Inbox (active) -->
      <g transform="translate(20, 0)">
        <rect width="24" height="24" rx="6" fill="#10b981" fill-opacity="0.12"/>
        <path d="M4 13 L4 18 Q4 20 6 20 L18 20 Q20 20 20 18 L20 13 L15 13 L13 16 L11 16 L9 13 Z" stroke="#10b981"/>
      </g>
      <!-- Outbound (send) -->
      <g transform="translate(20, 50)">
        <path d="M22 2 L11 13 M22 2 L15 22 L11 13 L2 9 Z" stroke="#94a3b8"/>
      </g>
      <!-- Bookings (calendar) -->
      <g transform="translate(20, 100)">
        <rect x="2" y="4" width="20" height="18" rx="2" stroke="#94a3b8"/>
        <line x1="2" y1="10" x2="22" y2="10" stroke="#94a3b8"/>
        <line x1="8" y1="2" x2="8" y2="6" stroke="#94a3b8"/>
        <line x1="16" y1="2" x2="16" y2="6" stroke="#94a3b8"/>
      </g>
      <!-- AI (sparkles) -->
      <g transform="translate(20, 150)">
        <path d="M12 2 L13 8 L19 9 L13 10 L12 16 L11 10 L5 9 L11 8 Z" stroke="#94a3b8"/>
        <path d="M19 14 L19.5 16 L21.5 16.5 L19.5 17 L19 19 L18.5 17 L16.5 16.5 L18.5 16 Z" stroke="#94a3b8"/>
      </g>
      <!-- Analytics -->
      <g transform="translate(20, 200)">
        <line x1="4" y1="20" x2="4" y2="14" stroke="#94a3b8"/>
        <line x1="10" y1="20" x2="10" y2="8" stroke="#94a3b8"/>
        <line x1="16" y1="20" x2="16" y2="11" stroke="#94a3b8"/>
        <line x1="22" y1="20" x2="22" y2="4" stroke="#94a3b8"/>
      </g>
      <!-- Channels (radio) -->
      <g transform="translate(20, 250)">
        <circle cx="12" cy="12" r="2" stroke="#94a3b8"/>
        <path d="M7 7 Q12 4 17 7 M9 9 Q12 8 15 9" stroke="#94a3b8"/>
      </g>
      <!-- Settings -->
      <g transform="translate(20, 320)">
        <circle cx="12" cy="12" r="3" stroke="#94a3b8"/>
        <path d="M12 2 L12 5 M12 19 L12 22 M2 12 L5 12 M19 12 L22 12 M5 5 L7 7 M17 17 L19 19 M5 19 L7 17 M17 7 L19 5" stroke="#94a3b8"/>
      </g>
      <!-- Profile -->
      <g transform="translate(20, 700)">
        <circle cx="12" cy="9" r="4" stroke="#94a3b8"/>
        <path d="M4 22 Q4 14 12 14 Q20 14 20 22" stroke="#94a3b8"/>
      </g>
    </g>
  </g>

  <!-- Main content: header + 2-pane inbox -->
  <g transform="translate(80, 16)">
    <text x="0" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#10b981" letter-spacing="3">INBOX</text>
    <text x="0" y="40" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="-0.5">All conversations</text>
    <text x="0" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#64748b">140 chats · 4 channels</text>
    <rect x="476" y="20" width="32" height="20" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="492" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#64748b">v1.0</text>
  </g>

  <!-- Thread list (left) -->
  <g transform="translate(80, 90)">
    <rect width="240" height="478" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <!-- search -->
    <g transform="translate(12, 12)">
      <rect width="216" height="32" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
      <circle cx="14" cy="16" r="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="17" y1="19" x2="20" y2="22" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="28" y="20" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8">Search conversations...</text>
    </g>
    <!-- filter chips -->
    <g transform="translate(12, 52)" font-family="Inter, system-ui, sans-serif" font-size="9">
      <rect width="36" height="20" rx="10" fill="#10b981"/>
      <text x="18" y="14" text-anchor="middle" fill="#ffffff" font-weight="600">All 140</text>
      <rect x="42" y="0" width="56" height="20" rx="10" fill="none" stroke="#10b981"/>
      <circle cx="52" cy="10" r="3" fill="#10b981"/>
      <text x="80" y="14" text-anchor="middle" fill="#10b981">WhatsApp</text>
      <rect x="102" y="0" width="50" height="20" rx="10" fill="none" stroke="#8b5cf6"/>
      <circle cx="112" cy="10" r="3" fill="#8b5cf6"/>
      <text x="135" y="14" text-anchor="middle" fill="#8b5cf6">IG</text>
      <rect x="156" y="0" width="42" height="20" rx="10" fill="none" stroke="#0ea5e9"/>
      <circle cx="166" cy="10" r="3" fill="#0ea5e9"/>
      <text x="184" y="14" text-anchor="middle" fill="#0ea5e9">Email</text>
      <rect x="202" y="0" width="38" height="20" rx="10" fill="none" stroke="#475569"/>
      <text x="221" y="14" text-anchor="middle" fill="#475569">TikTok</text>
    </g>
    <line x1="0" y1="86" x2="240" y2="86" stroke="#e2e8f0"/>
    <!-- thread rows -->
    <g transform="translate(0, 92)" font-family="Inter, system-ui, sans-serif">
      <!-- active row -->
      <g>
        <rect width="240" height="60" fill="#10b981" fill-opacity="0.05"/>
        <rect width="3" height="60" fill="#10b981"/>
        <circle cx="32" cy="20" r="14" fill="#10b981"/>
        <text x="32" y="24" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">G</text>
        <text x="54" y="18" font-size="11" font-weight="600" fill="#0f172a">Guest 001</text>
        <text x="226" y="18" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#64748b">18m</text>
        <text x="54" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#64748b">Ubud · 08-09 · 12 ppl</text>
        <rect x="54" y="40" width="58" height="14" rx="3" fill="#10b981" fill-opacity="0.15"/>
        <text x="83" y="50" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="600" fill="#10b981">INTERESTED</text>
      </g>
      <!-- Visitor 002 (violet IG) -->
      <g transform="translate(0, 60)">
        <circle cx="32" cy="20" r="14" fill="#8b5cf6"/>
        <text x="32" y="24" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">V</text>
        <text x="54" y="18" font-size="11" font-weight="500" fill="#0f172a">Visitor 002</text>
        <text x="226" y="18" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#64748b">1h</text>
        <text x="54" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#64748b">Nusa Penida · IG DM · 4 ppl</text>
        <rect x="54" y="40" width="42" height="14" rx="3" fill="#3b82f6" fill-opacity="0.15"/>
        <text x="75" y="50" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="600" fill="#3b82f6">NEW</text>
      </g>
      <!-- Traveler 003 (sky Email) -->
      <g transform="translate(0, 120)">
        <circle cx="32" cy="20" r="14" fill="#0ea5e9"/>
        <text x="32" y="24" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">T</text>
        <text x="54" y="18" font-size="11" font-weight="500" fill="#0f172a">Traveler 003</text>
        <text x="226" y="18" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#64748b">10h</text>
        <text x="54" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#64748b">Ubud · Email · 6 ppl</text>
        <rect x="54" y="40" width="76" height="14" rx="3" fill="#f59e0b" fill-opacity="0.18"/>
        <text x="92" y="50" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="600" fill="#b45309">AWAITING DEPOSIT</text>
      </g>
      <!-- Patron 004 (slate TikTok) -->
      <g transform="translate(0, 180)">
        <circle cx="32" cy="20" r="14" fill="#475569"/>
        <text x="32" y="24" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">P</text>
        <text x="54" y="18" font-size="11" font-weight="500" fill="#0f172a">Patron 004</text>
        <text x="226" y="18" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#64748b">5h</text>
        <text x="54" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#64748b">Nusa Penida · TikTok · 5 ppl</text>
        <rect x="54" y="40" width="42" height="14" rx="3" fill="#10b981" fill-opacity="0.15"/>
        <text x="75" y="50" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="600" fill="#10b981">NEW</text>
      </g>
      <!-- Customer 005 -->
      <g transform="translate(0, 240)">
        <circle cx="32" cy="20" r="14" fill="#10b981"/>
        <text x="32" y="24" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">C</text>
        <text x="54" y="18" font-size="11" font-weight="500" fill="#0f172a">Customer 005</text>
        <text x="226" y="18" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#64748b">1d</text>
        <text x="54" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#64748b">Ubud · 08-06 · 6 ppl</text>
        <rect x="54" y="40" width="56" height="14" rx="3" fill="#16a34a" fill-opacity="0.18"/>
        <text x="82" y="50" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="600" fill="#16a34a">BOOKED</text>
      </g>
    </g>
  </g>

  <!-- Conversation panel (right) -->
  <g transform="translate(336, 90)">
    <rect width="244" height="478" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <!-- header -->
    <g transform="translate(16, 16)">
      <circle cx="14" cy="14" r="14" fill="#10b981"/>
      <text x="14" y="18" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">G</text>
      <text x="34" y="14" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Guest 001</text>
      <circle cx="92" cy="14" r="3" fill="#10b981"/>
      <text x="100" y="17" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#10b981" font-weight="600">WhatsApp</text>
      <rect x="174" y="6" width="44" height="20" rx="10" fill="#10b981" fill-opacity="0.12"/>
      <text x="196" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="600" fill="#10b981">AI on</text>
    </g>
    <g transform="translate(16, 38)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#64748b">
      <text x="0" y="0">12 guests · 2026-08-09 · 13:00</text>
      <text x="0" y="14">Nusa Penida · TG-01</text>
    </g>
    <line x1="16" y1="62" x2="228" y2="62" stroke="#e2e8f0"/>
    <!-- guest bubble -->
    <g transform="translate(16, 76)">
      <rect width="170" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#0f172a">Hi! I'm looking to book</text>
      <text x="10" y="34" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#0f172a">12 ppl for Nusa Penida...</text>
    </g>
    <!-- agent bubble -->
    <g transform="translate(60, 132)">
      <rect width="170" height="44" rx="10" fill="#10b981"/>
      <text x="10" y="20" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#ffffff">Yes! Aug 9 13:00 slot is</text>
      <text x="10" y="34" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#ffffff">open for 12. Hold?</text>
    </g>
    <!-- guest 2 -->
    <g transform="translate(16, 188)">
      <rect width="170" height="36" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="22" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#0f172a">Yes please hold. Deposit?</text>
    </g>
    <!-- composer -->
    <g transform="translate(16, 410)">
      <rect width="212" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="14" y="30" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8">Type a reply...</text>
      <rect x="172" y="12" width="32" height="24" rx="6" fill="#10b981"/>
      <text x="188" y="28" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffffff">Send</text>
    </g>
  </g>

  <!-- footer -->
  <g transform="translate(80, 600)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#64748b" letter-spacing="2">FOUR INBOXES  ·  ONE QUEUE  ·  ONE TRUTH</text>
    <text x="0" y="18" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#0f172a" font-weight="600">From 4 inboxes to 1 morning read. Zero humans in the loop.</text>
  </g>
  <g transform="translate(0, 0)">
    <text x="20" y="780" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#94a3b8" letter-spacing="2">PT UNICORN · INTERNAL · 05/05</text>
  </g>
</svg>
